experiment:
  server:
    hostname: Armagedon
    cpu_description: i7-4790 Intel Core
    hertz: 3.60
    cores: 4
    threads: 8
    ram_memory: 32
    operating_system: Ubuntu 22.04.4 LTS
  benchmarks:
    - name: "pi"
      version: 1
      path: ./applications/pi
      setup: "mkdir -p $PATH/output  ./report/pi/metric/ ./report/pi/performance/"
      description: "Calculates the PI number based on the Monte Carlo distribution."
  executions:
    - bench_name: pi
      bench_version: 1
      num_executions: 10
      num_threads: [1, 2, 4, 8]
      inputs:
        num_iterations: 1000000000
        file_output: output.csv
      variants:
        - type: common
          compile: "make -C $PATH"
          pos_processing: "mv output.csv $PATH/output/output_$ID_GROUPg_$ID_RUN.csv"
          baseline: true
          env_vars:
            OMP_PROC_BIND: "TRUE"
        - type: omp
          compile: "make NUM_THREADS=$NUM_THREADS -C $PATH omp"
          pos_processing: "mv output.csv $PATH/output/output_$ID_GROUPg_$ID_RUN.csv"
          metric:
            type: MAPE
            reference: $PATH/output/output_$ID_GROUP_BASEg_$ID_BASE.csv
            prediction: $PATH/output/output_$ID_GROUPg_$ID_RUN.csv
          env_vars:
            OMP_PROC_BIND: "TRUE"
        - type: approx
          approx_type: perfo_init
          approx_rates: [10, 100, 500, 1000]
          compile: "make NUM_THREADS=$NUM_THREADS DROP=$APPROX_RATE -C $PATH perfo_init"
          pos_processing: "mv output.csv $PATH/output/output_$ID_GROUPg_$ID_RUN.csv"
          metric:
            type: MAPE
            reference: $PATH/output/output_$ID_GROUP_BASEg_$ID_BASE.csv
            prediction: $PATH/output/output_$ID_GROUPg_$ID_RUN.csv
          env_vars:
            OMP_PROC_BIND: "TRUE"
            OMP_APPROX: "TRUE"
        - type: approx
          approx_type: perfo_fini
          approx_rates: [10, 100, 500, 1000]
          compile: "make NUM_THREADS=$NUM_THREADS DROP=$APPROX_RATE -C $PATH perfo_fini"
          pos_processing: "mv output.csv $PATH/output/output_$ID_GROUPg_$ID_RUN.csv"
          metric:
            type: MAPE
            reference: $PATH/output/output_$ID_GROUP_BASEg_$ID_BASE.csv
            prediction: $PATH/output/output_$ID_GROUPg_$ID_RUN.csv
          env_vars:
            OMP_PROC_BIND: "TRUE"
            OMP_APPROX: "TRUE"
